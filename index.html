<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poziv na kafu ☕</title>

    <!-- Open Graph tagovi za Viber i društvene mreže -->
    <meta property="og:title" content="💌 Tajna poruka za tebe...">
    <meta property="og:description" content="Klikni da vidiš o čemu se radi... ☕✨">
    <meta property="og:image" content="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=1000&auto=format&fit=crop">
    <meta property="og:url" content="https://saracen7mi.github.io/kafa/">
    <meta property="og:type" content="website">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
        }
        h2 {
            color: #4a2e35;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
            min-height: 60px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
        }
        #yesBtn {
            background-color: #f48fb1;
            color: white;
        }
        #yesBtn:hover {
            background-color: #ec407a;
        }
        #noBtn {
            background-color: #e0e0e0;
            color: #616161;
            position: relative;
        }
        .hidden {
            display: none;
        }
        img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            width: 80%;
        }
        .food-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .food-item {
            background: #f3f4f6;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            font-size: 28px;
        }
        .food-item.selected {
            border-color: #f48fb1;
            background: #fce4ec;
        }
    </style>
</head>
<body>

    <div class="card" id="step1">
        <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=400&auto=format&fit=crop" alt="Coffee time">
        <h2>Hoćeš li na kafu sa mnom? ☕</h2>
        <div class="buttons">
            <button id="yesBtn" onclick="nextStep(2)">MOŽE 💖</button>
            <button id="noBtn" onmouseover="moveButton()" ontouchstart="moveButton()" onclick="moveButton()">nema šanse 🙄</button>
        </div>
    </div>

    <div class="card hidden" id="step2">
        <img src="https://media.giphy.com/media/3o7abAHdYvZdBNnHZk/giphy.gif" alt="Shocked">
        <h2>Čekaj, ti si stvarno pristala?! 😭</h2>
        <p style="color: #666; margin-bottom: 20px;">Baš sam se spremio da mi stisneš "ne" 🥲</p>
        <button id="yesBtn" onclick="nextStep(3)">ajde idi dalje →</button>
    </div>

    <div class="card hidden" id="step3">
        <h2>Kad si slobodna? 🗓️</h2>
        <p style="color: #666; font-size: 14px;">Izaberi datum</p>
        <input type="date" id="datePicker"><br>
        <button id="yesBtn" onclick="saveDateAndNext()">zapiši datum! 💌</button>
    </div>

    <div class="card hidden" id="step4">
        <h2>Uz kafu, šta nam je činiti? 🥧✨</h2>
        <div class="food-grid">
            <div class="food-item" onclick="selectFood(this)" title="Kafa">☕</div>
            <div class="food-item" onclick="selectFood(this)" title="Čaj">🫖</div>
            <div class="food-item" onclick="selectFood(this)" title="Kolač">🍰</div>
            <div class="food-item" onclick="selectFood(this)" title="Trazenje zajednickog jezika">💋</div>
            <div class="food-item" onclick="selectFood(this)" title="Sok">🧃</div>
            <div class="food-item" onclick="selectGridItem(this, 'Pitica')">🥧</div>
        </div>
        <button id="yesBtn" onclick="sendSMS()">pošalji mi SMS! 🚀</button>
    </div>

    <div class="card hidden" id="step5">
        <img src="https://media.giphy.com/media/LndvD7m1T484o/giphy.gif" alt="Happy cat">
        <h2>To se traži! Računaj da je dogovoreno. 🥰</h2>
        <p style="color: #666;">SMS je spreman za slanje! ✨</p>
    </div>

    <script>
        let chosenDate = '';
        let chosenOption = 'Domaća kafa ☕';

        // Bježeće dugme (prilagođeno i za dodir prstom na mobitelu i za miš)
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            const maxX = window.innerWidth - noBtn.offsetWidth - 40;
            const maxY = window.innerHeight - noBtn.offsetHeight - 40;
            const x = Math.random() * Math.max(0, maxX);
            const y = Math.random() * Math.max(0, maxY);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${Math.max(20, x)}px`;
            noBtn.style.top = `${Math.max(20, y)}px`;
        }

        // Prijelaz između koraka
        function nextStep(step) {
            document.querySelectorAll('.card').forEach(card => card.classList.add('hidden'));
            document.getElementById('step' + step).classList.remove('hidden');
        }

        function saveDateAndNext() {
            const dateInput = document.getElementById('datePicker').value;
            if(!dateInput) {
                alert('Molimo izaberi datum! 😊');
                return;
            }
            chosenDate = dateInput;
            nextStep(4);
        }

        // Odabir opcije
        function selectFood(element) {
            document.querySelectorAll('.food-item').forEach(item => item.classList.remove('selected'));
            element.classList.add('selected');
            chosenOption = element.getAttribute('title');
        }

        function selectGridItem(element, titleText) {
            document.querySelectorAll('.food-item').forEach(item => item.classList.remove('selected'));
            element.classList.add('selected');
            chosenOption = titleText;
        }

        // Slanje SMS-a
        function sendSMS() {
            const phoneNumber = "+38761557114";
            const message = encodeURIComponent(`Može! Vidimo se ${chosenDate}, a uz kafu biram: ${chosenOption} 💋✨`);
            
            window.location.href = `sms:${phoneNumber}?body=${message}`;
            
            setTimeout(() => {
                nextStep(5);
            }, 500);
        }
    </script>
</body>
</html>
